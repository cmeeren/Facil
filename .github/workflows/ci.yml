name: CI

on: [ push, pull_request ]

permissions:
  contents: read

env:
  FACIL_FORCE_REGENERATE: 1
  FACIL_FAIL_ON_CHANGED_OUTPUT: 1
  connectionString: Data Source=localhost;Database=FacilTest;User ID=sa;Password=CXTxgxnkzcTcLMCwKjqi4XbKgwFtw;TrustServerCertificate=True

jobs:
  ci:

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: './global.json'

      - name: Restore tools
        run: dotnet tool restore

      - name: Check code format
        run: dotnet fantomas --check .

      - name: Test release helper
        run: node --test .agents/skills/release-facil/scripts/wait-for-nuget.test.js

      - name: Install SQL Server
        run: |
          docker build -f .github/sql-server.Dockerfile -t facil-test-sql .github
          docker run -d -e 'ACCEPT_EULA=Y' -e 'MSSQL_SA_PASSWORD=CXTxgxnkzcTcLMCwKjqi4XbKgwFtw' -e 'MSSQL_COLLATION=SQL_Latin1_General_CP1_CI_AS' --name sql -p 1433:1433 facil-test-sql
          sleep 10s
          docker ps -a
          docker logs -t sql

      - name: Build DB
        run: dotnet build src/TestDb/TestDb.sqlproj -c Release

      - name: Publish DB
        run: dotnet sqlpackage /Action:Publish /SourceFile:"src/TestDb/bin/Release/TestDb.dacpac" /TargetConnectionString:"$connectionString"

      - name: Build package project
        run: dotnet build src/Facil.Package -c Release

      # Pack in a separate step (fails for some reason with "empty lib/" error if using <GeneratePackageOnBuild>)
      - name: Pack
        run: dotnet pack src/Facil.Package -c Release

      - name: Build package smoke tests
        run: dotnet build src/PackageTests -c Release

      - name: Run package smoke tests
        run: dotnet src/PackageTests/bin/Release/net10.0/PackageTests.dll --fail-on-focused-tests

      # Build tests
      - name: Build tests
        run: dotnet build src/DbTests -c Release

      - name: Test
        run: dotnet src/DbTests/bin/Release/net10.0/DbTests.dll --fail-on-focused-tests

      # Publish the package the smoke tests verified, without building in the job that can publish
      - name: Upload package
        if: startsWith(github.ref, 'refs/tags/v/')
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: nupkg/Facil.*.nupkg
          if-no-files-found: error


  publish:

    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v/')
    permissions:
      contents: read
      id-token: write

    needs:
      - ci

    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: package
          path: artifacts/packages

      - name: NuGet login
        uses: NuGet/login@v1.2.0
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Uses the runner's preinstalled .NET SDK, since this job builds nothing
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/packages/*.nupkg -s "https://api.nuget.org/v3/index.json" -k "$NUGET_API_KEY" --skip-duplicate
